version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mom_audio_capture
    container_name: mom_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn backend:app --host 0.0.0.0 --port 3000 --reload
